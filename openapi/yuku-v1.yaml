openapi: 3.0.3
info:
  title: YUKU API
  version: 1.0.0
  description: Initial API contract for YUKU marketplace.
servers:
  - url: http://localhost:3000/api/v1
paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: Service is healthy
  /categories:
    get:
      summary: List service categories
      responses:
        '200':
          description: Category list
  /services:
    get:
      summary: Search published services
      parameters:
        - in: query
          name: pillar
          schema: { type: string, enum: [FRIEND, EXPERIENCE, PRO] }
        - in: query
          name: city
          schema: { type: string }
        - in: query
          name: mode
          schema: { type: string, enum: [ONLINE, OFFLINE, BOTH] }
      responses:
        '200':
          description: Service results
  /bookings:
    post:
      summary: Create booking request
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Booking created
        '400':
          description: Invalid request
  /payments/checkout:
    post:
      summary: Create payment checkout
      security: [{ bearerAuth: [] }]
      responses:
        '201':
          description: Checkout created
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
