name: yuku_app
description: MAVO social platform mobile app
publish_to: 'none'
version: 1.0.0+3
environment:
  sdk: '>=3.4.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  http: ^1.2.2
  flutter_secure_storage: ^9.2.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4
flutter:
  uses-material-design: true

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/branding/mavo_launcher.png"
  adaptive_icon_background: "#08051B"
  adaptive_icon_foreground: "assets/branding/mavo_launcher.png"
