name: MAVO Android APK Preview

on:
  push:
    branches:
      - mavo/version-9-restore
    paths:
      - "mobile/yuku_app/**"
      - ".github/workflows/android-apk.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files
        working-directory: mobile/yuku_app
        run: flutter create --platforms=android --org com.mavo.app .

      - name: Set MAVO app display name
        working-directory: mobile/yuku_app
        run: sed -i 's/android:label="yuku_app"/android:label="MAVO"/' android/app/src/main/AndroidManifest.xml

      - name: Apply MAVO launcher icon
        run: |
          sudo apt-get update
          sudo apt-get install -y librsvg2-bin
          # Use the flat MAVO artwork for all Android launcher densities.
          # Remove Flutter's generated adaptive icon so Android uses these PNGs consistently.
          rm -rf mobile/yuku_app/android/app/src/main/res/mipmap-anydpi-v26
          for spec in "mdpi 48" "hdpi 72" "xhdpi 96" "xxhdpi 144" "xxxhdpi 192"; do
            set -- $spec
            density="$1"
            size="$2"
            mkdir -p "mobile/yuku_app/android/app/src/main/res/mipmap-$density"
            rsvg-convert -w "$size" -h "$size" "mobile/yuku_app/assets/branding/mavo_launcher.svg" > "mobile/yuku_app/android/app/src/main/res/mipmap-$density/ic_launcher.png"
          done

      - name: Install dependencies
        working-directory: mobile/yuku_app
        run: flutter pub get

      - name: Build preview APK
        working-directory: mobile/yuku_app
        run: flutter build apk --debug --build-number=${{ github.run_number }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: mavo-android-preview-apk
          path: mobile/yuku_app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
