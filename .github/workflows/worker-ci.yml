name: Cloudflare Worker CI

on:
  push:
    branches:
      - main
      - feature/mavo-user-auth
    paths:
      - "backend-worker/**"
      - ".github/workflows/worker-ci.yml"
  pull_request:
    paths:
      - "backend-worker/**"
      - ".github/workflows/worker-ci.yml"

jobs:
  validate:
    name: Validate isolated preview Worker
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        working-directory: backend-worker
        run: npm install
      - name: Typecheck
        working-directory: backend-worker
        run: npm run typecheck
      - name: Wrangler dry run
        working-directory: backend-worker
        run: npx wrangler deploy --dry-run --config wrangler.preview.jsonc
