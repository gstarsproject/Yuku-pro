name: Flutter Mobile CI

on:
  push:
    branches: [main]
    paths:
      - "mobile/yuku_app/**"
      - ".github/workflows/flutter-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "mobile/yuku_app/**"
      - ".github/workflows/flutter-ci.yml"

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mobile/yuku_app
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Flutter dependencies
        run: flutter pub get
      - name: Analyze Flutter code
        run: flutter analyze --no-fatal-infos
      - name: Run Flutter tests
        run: flutter test
      - name: Generate Android platform files
        run: flutter create --platforms=android --project-name yuku .
      - name: Build optimized Android release APKs
        run: flutter build apk --release --split-per-abi
      - name: Upload Samsung-compatible arm64 APK
        uses: actions/upload-artifact@v4
        with:
          name: yuku-android-arm64-release
          path: mobile/yuku_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 7
