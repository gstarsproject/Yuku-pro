services:
  db:
    image: postgres:16
    container_name: MAVO-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: MAVO
      POSTGRES_USER: MAVO
      POSTGRES_PASSWORD: MAVO_local_only
    ports:
      - "5432:5432"
    volumes:
      - MAVO_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U MAVO -d MAVO"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  MAVO_pgdata:
